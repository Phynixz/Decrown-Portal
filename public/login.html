<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — De-Crown Cottage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Theme variables ──────────────────────────────────────────────── */
    :root {
      --bg:       #faf7f2;
      --card-bg:  #ffffff;
      --input-bg: #ffffff;
      --text:     #2c2418;
      --muted:    #8a7560;
      --border:   #ddd4c0;
      --navy:     #1a3c5e;
      --navy2:    #0f2744;
      --terra:    #c4622d;
      --error:    #c0392b;
    }
    html.dark {
      --bg:       #0f1117;
      --card-bg:  #1e2130;
      --input-bg: #252838;
      --text:     #e8eaf0;
      --muted:    #6b7788;
      --border:   #2e3347;
      --navy:     #4d9be6;
      --navy2:    #6ab0f5;
      --terra:    #e07b4a;
      --error:    #ef5350;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transition: background 0.25s;
    }

    /* ── Left panel (always navy — does NOT change in dark mode) ─────── */
    .panel-left {
      background: #1a3c5e;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 52px;
      position: relative;
      overflow: hidden;
    }
    .panel-left::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(196,98,45,0.12);
      top: -100px; left: -100px;
    }
    .panel-left::after {
      content: '';
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: 60px; right: -80px;
    }
    .logo-area { position: relative; z-index: 1; }
    .logo-area img {
      width: 60px; height: 60px;
      border-radius: 13px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
      display: block;
    }
    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .logo-area p {
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
    }

    /* Portal switch link on left panel */
    .left-footer { position: relative; z-index: 1; }
    .left-footer p { color: rgba(255,255,255,0.28); font-size: 12px; margin-bottom: 14px; }
    .switch-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 9px;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .switch-link:hover { background: rgba(255,255,255,0.13); color: #fff; }

    /* ── Right panel ──────────────────────────────────────────────────── */
    .panel-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 52px;
      background: var(--card-bg);
      transition: background 0.25s;
      position: relative;
    }

    /* Theme toggle — top-right of right panel */
    .theme-btn {
      position: absolute;
      top: 20px; right: 24px;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .theme-btn:hover { border-color: var(--navy); transform: scale(1.08); }

    .login-box { width: 100%; max-width: 380px; }

    .login-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 5px;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    .field input {
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,60,94,0.1); }

    .pass-wrap { position: relative; }
    .pass-wrap input { width: 100%; padding-right: 46px; }
    .eye-btn {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 18px;
      color: var(--muted);
    }

    .remember-row { display: flex; align-items: center; margin-bottom: 22px; }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .remember-label input { width: 15px; height: 15px; accent-color: var(--navy); cursor: pointer; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover { background: var(--navy2); }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { background: #a0b0c4; cursor: not-allowed; }

    .error-box {
      margin-top: 14px;
      padding: 11px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      display: none;
    }
    html.dark .error-box { background: #2a0f0f; border-color: rgba(239,83,80,0.3); }
    .error-box.show { display: block; }

    /* Mobile-only: link to tenant portal */
    .mobile-portal-link {
      display: none;
      text-align: center;
      margin-top: 22px;
    }
    .mobile-portal-link a {
      color: var(--navy);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border: 1.5px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      display: inline-block;
      transition: all 0.2s;
    }
    .mobile-portal-link a:hover { background: var(--bg); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: shake 0.35s; }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 40px 24px; align-items: flex-start; padding-top: 60px; }
      .mobile-portal-link { display: block; }
    }
  </style>
</head>
<body>

  <!-- Left decorative panel -->
  <div class="panel-left">
    <div class="logo-area">
      <img src="/d420ac751563a3d498bd84cdf69386bb.jpg" alt="De-Crown Logo" />
      <h1>De-Crown<br>Cottage</h1>
      <p>Hostel management portal for<br>Malete & Ila-Orangun campuses.</p>
    </div>
    <div class="left-footer">
      <p>© 2024 De-Crown Cottage. All rights reserved.</p>
      <a href="tenant-portal.html" class="switch-link">🏠 I'm a Tenant →</a>
    </div>
  </div>

  <!-- Right: login form -->
  <div class="panel-right">

    <!-- Dark mode toggle -->
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>

    <div class="login-box">
      <h2>Admin Login</h2>
      <p class="subtitle">Sign in to the management dashboard</p>

      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@decrown.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="eye-btn" type="button" onclick="togglePwd()" id="eyeBtn">👁</button>
        </div>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" id="remember" />
          Remember me
        </label>
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In</button>
      <div class="error-box" id="errBox"></div>

      <!-- Mobile only -->
      <div class="mobile-portal-link">
        <a href="tenant-portal.html">🏠 Go to Tenant Portal</a>
      </div>
    </div>
  </div>

  <script>
    // ── Theme ────────────────────────────────────────────────────────────
    (function () {
      const saved = localStorage.getItem("theme") || "light";
      if (saved === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("themeBtn").textContent = "☀️";
      }
    })();

    function toggleTheme() {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", dark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = dark ? "☀️" : "🌙";
    }

    // ── Password toggle ──────────────────────────────────────────────────
    function togglePwd() {
      const p = document.getElementById("password");
      const b = document.getElementById("eyeBtn");
      p.type = p.type === "password" ? "text" : "password";
      b.textContent = p.type === "password" ? "👁" : "🙈";
    }

    // ── Login ────────────────────────────────────────────────────────────
    async function doLogin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errBox   = document.getElementById("errBox");
      const btn      = document.getElementById("loginBtn");

      errBox.classList.remove("show");
      if (!email || !password) { showErr("Please enter your email and password."); return; }

      btn.textContent = "Signing in…";
      btn.disabled = true;

      try {
        const res  = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        const store = document.getElementById("remember").checked ? localStorage : sessionStorage;
        store.setItem("token",     "Bearer " + data.token);
        store.setItem("adminName", data.name);
        store.setItem("adminRole", data.role);

        window.location.href = "admin.html";
      } catch (e) {
        showErr(e.message);
        document.querySelector(".login-box").classList.add("shake");
        setTimeout(() => document.querySelector(".login-box").classList.remove("shake"), 400);
      } finally {
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    }

    function showErr(msg) {
      const b = document.getElementById("errBox");
      b.textContent = msg;
      b.classList.add("show");
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
