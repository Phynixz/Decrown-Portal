<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — De-Crown Cottage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #1a3c5e;
        --navy2: #0f2744;
        --cream: #faf7f2;
        --cream2: #f2ece0;
        --terra: #c4622d;
        --text: #2c2418;
        --text2: #5a4a3a;
        --muted: #8a7560;
        --border: #ddd4c0;
        --white: #ffffff;
        --font-h: "Playfair Display", serif;
        --font-b: "Outfit", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-b);
        background: var(--cream);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      header h1 {
        font-family: var(--font-h);
        font-size: 32px;
        color: var(--navy);
      }

      .header-actions {
        display: flex;
        gap: 12px;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: var(--font-b);
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-primary {
        background: var(--navy);
        color: var(--white);
      }

      .btn-primary:hover {
        background: var(--navy2);
        box-shadow: 0 4px 12px rgba(26, 60, 94, 0.2);
      }

      .btn-secondary {
        background: var(--cream2);
        color: var(--navy);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--border);
      }

      .profile-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 32px;
      }

      @media (max-width: 768px) {
        .profile-grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(44, 36, 24, 0.06);
      }

      .card-title {
        font-family: var(--font-h);
        font-size: 18px;
        color: var(--navy);
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }

      .profile-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid var(--cream2);
      }

      .profile-row:last-child {
        border-bottom: none;
      }

      .profile-label {
        font-weight: 600;
        color: var(--navy);
        min-width: 130px;
      }

      .profile-value {
        color: var(--text2);
        text-align: right;
        flex: 1;
      }

      .profile-value.link {
        color: var(--terra);
        text-decoration: none;
        cursor: pointer;
      }

      .profile-value.link:hover {
        text-decoration: underline;
      }

      .document-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .doc-tile {
        background: var(--cream2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }

      .doc-tile:hover {
        background: var(--border);
        transform: translateY(-2px);
      }

      .doc-tile.empty {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .doc-tile.empty:hover {
        background: var(--cream2);
        transform: none;
      }

      .doc-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }

      .doc-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--navy);
        margin-bottom: 4px;
      }

      .doc-status {
        font-size: 12px;
        color: var(--muted);
      }

      .room-highlight {
        background: linear-gradient(
          135deg,
          var(--cream2) 0%,
          var(--white) 100%
        );
        border: 2px solid var(--terra);
      }

      .room-highlight .card-title {
        color: var(--terra);
      }

      .status-pending {
        background: #fff3cd;
        color: #856404;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #ffc107;
      }

      .status-approved {
        background: #d4edda;
        color: #155724;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #28a745;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>My Profile</h1>
        <div class="header-actions">
          <button class="btn-secondary" onclick="goBack()">← Back</button>
        </div>
      </header>

      <div id="statusAlert"></div>
      <div id="content" class="loading">Loading your profile...</div>
    </div>

    <script>
      let tenantToken = sessionStorage.getItem("tenantToken") || "";
      if (!tenantToken) {
        window.location.href = "tenant-portal.html";
      }

      async function loadProfile() {
        try {
          const res = await fetch("/tenant/me", {
            headers: { Authorization: tenantToken },
          });
          if (!res.ok) {
            window.location.href = "tenant-portal.html";
            return;
          }

          const profile = await res.json();
          renderProfile(profile);
        } catch (err) {
          document.getElementById("content").innerHTML =
            `<div class="error">Failed to load profile: ${err.message}</div>`;
        }
      }

      function renderProfile(p) {
        const html = `
          ${
            !p.retainPending
              ? `<div class="status-approved">✓ Your profile is complete and approved</div>`
              : `<div class="status-pending">⏳ Your profile is pending admin review</div>`
          }

          <div class="profile-grid">
            <!-- Personal Information -->
            <div class="card">
              <div class="card-title">Personal Information</div>
              <div class="profile-row">
                <span class="profile-label">Name</span>
                <span class="profile-value">${esc(p.name)}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value">${esc(p.email)}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Phone</span>
                <span class="profile-value">${esc(p.phone)}</span>
              </div>
              ${
                p.guardianName
                  ? `
                <div class="profile-row">
                  <span class="profile-label">Guardian</span>
                  <span class="profile-value">${esc(p.guardianName)}</span>
                </div>
                <div class="profile-row">
                  <span class="profile-label">Guardian Phone</span>
                  <span class="profile-value">${esc(p.guardianPhone)}</span>
                </div>
              `
                  : ""
              }
            </div>

            <!-- Room & Session -->
            <div class="card room-highlight">
              <div class="card-title">Room Assignment</div>
              <div class="profile-row">
                <span class="profile-label">Location</span>
                <span class="profile-value">${esc(p.location)}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Room No.</span>
                <span class="profile-value">${esc(p.roomNo)}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Type</span>
                <span class="profile-value">${esc(p.type)}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Level</span>
                <span class="profile-value">${esc(p.level || "—")}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Session</span>
                <span class="profile-value">${esc(p.session)}</span>
              </div>
            </div>

            <!-- Payment Information -->
            <div class="card">
              <div class="card-title">Payment Details</div>
              <div class="profile-row">
                <span class="profile-label">Amount</span>
                <span class="profile-value">₦${Number(p.amount || 0).toLocaleString()}</span>
              </div>
              <div class="profile-row">
                <span class="profile-label">Payment Date</span>
                <span class="profile-value">${
                  p.paymentDate
                    ? new Date(p.paymentDate).toLocaleDateString("en-NG", {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                      })
                    : "—"
                }</span>
              </div>
            </div>

            <!-- Documents -->
            <div class="card">
              <div class="card-title">Uploaded Documents</div>
              <div class="document-grid">
                <div class="doc-tile ${p.passport ? "" : "empty"}">
                  <div class="doc-icon">📷</div>
                  <div class="doc-name">Passport</div>
                  <div class="doc-status">
                    ${
                      p.passport
                        ? '<a href="' +
                          p.passport +
                          '" target="_blank" style="color: var(--terra); text-decoration: none;">View</a>'
                        : "Not uploaded"
                    }
                  </div>
                </div>
                <div class="doc-tile ${p.idCard ? "" : "empty"}">
                  <div class="doc-icon">🆔</div>
                  <div class="doc-name">ID Card</div>
                  <div class="doc-status">
                    ${
                      p.idCard
                        ? '<a href="' +
                          p.idCard +
                          '" target="_blank" style="color: var(--terra); text-decoration: none;">View</a>'
                        : "Not uploaded"
                    }
                  </div>
                </div>
                <div class="doc-tile ${p.paymentProof ? "" : "empty"}">
                  <div class="doc-icon">💳</div>
                  <div class="doc-name">Payment Proof</div>
                  <div class="doc-status">
                    ${
                      p.paymentProof
                        ? '<a href="' +
                          p.paymentProof +
                          '" target="_blank" style="color: var(--terra); text-decoration: none;">View</a>'
                        : "Not uploaded"
                    }
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById("content").innerHTML = html;
      }

      function esc(s) {
        return String(s ?? "—").replace(
          /[<>&"]/g,
          (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c],
        );
      }

      function goBack() {
        window.history.back();
      }

      loadProfile();
    </script>
  </body>
</html>
