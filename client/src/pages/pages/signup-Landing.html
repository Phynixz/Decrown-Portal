<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Haven Properties</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-ink: #1a1a18;
        --color-paper: #ffffff;
        --color-surface: #f6f5f2;
        --color-border: #e7e5e0;
        --color-muted: #78766f;
        --color-accent: #a8482a;
        --color-accent-dark: #8a3a21;
        --font-display: "Fraunces", ui-serif, Georgia, serif;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body
    class="flex min-h-screen flex-col bg-surface font-sans text-ink antialiased"
  >
    <!-- ===================== LOGO ===================== -->
    <div class="px-4 py-6 sm:px-6 lg:px-8">
      <a href="index.html" class="inline-flex items-center gap-2.5">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-ink"
        >
          <span class="font-display text-[13px] font-semibold text-white"
            >H</span
          >
        </span>
        <span class="font-display text-[17px] font-medium text-ink">Haven</span>
      </a>
    </div>

    <!-- ===================== SIGNUP CARD ===================== -->
    <main class="flex flex-1 items-center justify-center px-4 py-8 sm:px-6">
      <div
        class="w-full max-w-sm rounded-2xl border border-border bg-white p-8"
      >
        <p
          class="text-[12px] font-semibold uppercase tracking-[0.14em] text-accent"
        >
          Get Started
        </p>
        <h1
          class="mt-2 font-display text-[26px] font-medium leading-tight text-ink"
        >
          Create your account
        </h1>
        <p class="mt-2 text-[13px] leading-relaxed text-muted">
          Sign up to save properties, track enquiries and list with the agency.
        </p>

        <!-- Continue with Google -->
        <a
          href="#"
          class="mt-6 flex w-full items-center justify-center gap-2.5 rounded-lg border border-border bg-white px-4 py-2.5 text-[13px] font-medium text-ink transition-colors hover:bg-surface"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 48 48">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5Z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7Z"
            />
            <path
              fill="#4CAF50"
              d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.9 27 36 24 36c-5.2 0-9.6-3.4-11.2-8.1l-6.6 5.1C9.9 39.7 16.4 44 24 44Z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.7l6.6 5.6C41.5 36.1 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5Z"
            />
          </svg>
          Continue with Google
        </a>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-3">
          <span class="h-px flex-1 bg-border"></span>
          <span
            class="text-[11px] font-medium uppercase tracking-wide text-muted"
            >or</span
          >
          <span class="h-px flex-1 bg-border"></span>
        </div>

        <!-- Continue with email -->
        <form class="space-y-4">
          <div>
            <label for="email" class="block text-[13px] font-medium text-ink"
              >Email address</label
            >
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="you@example.com"
              class="mt-1.5 w-full rounded-lg border border-border bg-white px-3.5 py-2.5 text-[14px] text-ink placeholder-muted/60 focus:border-ink/30 focus:outline-none focus:ring-[3px] focus:ring-ink/[0.06]"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-ink px-4 py-2.5 text-[13px] font-medium text-white transition-colors hover:bg-ink/90"
          >
            Continue with Email
          </button>
        </form>

        <p class="mt-6 text-center text-[12px] leading-relaxed text-muted">
          By continuing, you agree to Haven's
          <a href="#" class="font-medium text-ink hover:text-accent"
            >Terms of Service</a
          >
          and
          <a href="#" class="font-medium text-ink hover:text-accent"
            >Privacy Policy</a
          >.
        </p>
      </div>
    </main>

    <!-- ===================== FOOTER LINK ===================== -->
    <p class="pb-8 text-center text-[13px] text-muted">
      Already have an account?
      <a href="#" class="font-medium text-ink hover:text-accent">Log in</a>
    </p>
  </body>
</html>
